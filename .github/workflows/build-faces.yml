name: Match new player face images

# build_faces.py itself only matches players missing from data/faces.json
# (new signings), so this is cheap enough to run daily instead of the
# "occasionally, by hand" cadence its docstring used to require.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-faces
  cancel-in-progress: false

jobs:
  faces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match new/missing player faces
        run: python3 scripts/build_faces.py

      - name: Commit if changed
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/faces.json
          if git diff --cached --quiet; then
            echo "No new faces matched."
          else
            git commit -m "faces: match new signings $(date -u +'%Y-%m-%d')"
            git push
          fi
