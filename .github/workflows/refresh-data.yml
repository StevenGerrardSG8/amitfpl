name: Refresh FPL data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FPL snapshots
        run: python3 scripts/fetch_data.py

      - name: Send Telegram alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/alerts.py

      - name: Capture model predictions
        run: node scripts/predict.mjs || echo "prediction snapshot skipped"

      - name: Calibrate model vs real results
        run: python3 scripts/calibrate.py || echo "calibration skipped"

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ js/names-he.js
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            msg="data: refresh $(date -u +'%Y-%m-%d %H:%MZ')"
            if ! git diff --cached --quiet -- js/names-he.js; then
              msg="$msg (+ names-he auto-resolve via Wikidata)"
            fi
            git commit -m "$msg"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN (as the step above
      # just did) deliberately does NOT trigger other workflows' `on:
      # push` - a GitHub anti-recursion rule - so deploy-pages.yml's own
      # push trigger silently never fires for these commits. Every
      # refreshed data/*.json was landing in the repo but never actually
      # reaching the live site, only ever going out incidentally whenever
      # an unrelated code PR happened to get merged. Explicitly dispatch
      # the deploy - a workflow_dispatch call is a different mechanism
      # from the push-triggers-workflow rule, so it isn't blocked by it.
      - name: Deploy the refreshed data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
