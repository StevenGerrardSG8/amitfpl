name: Refresh FPL data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FPL snapshots
        run: python3 scripts/fetch_data.py

      - name: Send Telegram alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/alerts.py

      - name: Capture model predictions
        run: node scripts/predict.mjs || echo "prediction snapshot skipped"

      - name: Calibrate model vs real results
        run: python3 scripts/calibrate.py || echo "calibration skipped"

      - name: Commit if changed
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
