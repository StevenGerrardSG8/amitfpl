name: Deploy FPL proxy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Save the worker URL into config.json
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          python3 - <<'PY'
          import json
          import os

          url = os.environ["WORKER_URL"]
          with open("config.json") as f:
              cfg = json.load(f)
          if url and cfg.get("proxyUrl") != url:
              cfg["proxyUrl"] = url
              with open("config.json", "w") as f:
                  json.dump(cfg, f, indent=2)
                  f.write("\n")
          PY

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "No config change."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: point config.json's proxyUrl at the deployed worker"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same anti-recursion rule as refresh-data.yml: a GITHUB_TOKEN push
      # doesn't trigger deploy-pages.yml's own push trigger, so the new
      # proxyUrl would otherwise sit in the repo without reaching the
      # live site. Dispatch it explicitly.
      - name: Deploy the updated site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
