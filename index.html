<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal Fantasy Premier League toolkit: expected points model, squad planner with transfer simulation, predicted lineups, fixtures and live match data." />
  <title>amitfpl - FPL Toolkit</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Apply theme + language direction before first paint to avoid a
    // flash. Explicit choices win; otherwise follow the system theme
    // and the browser language.
    try {
      var storedTheme = localStorage.getItem('amitfpl:theme');
      if (storedTheme === 'dark' ||
          (!storedTheme && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
      var storedLang = localStorage.getItem('amitfpl:lang');
      var wantHe = storedLang === 'he' ||
        (!storedLang && (navigator.language || '').toLowerCase().indexOf('he') === 0);
      if (wantHe) {
        document.documentElement.lang = 'he';
        document.documentElement.dir = 'rtl';
      }
    } catch (e) { /* private mode */ }
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="modulepreload" href="js/i18n.js" />
  <link rel="modulepreload" href="js/names-he.js" />
  <link rel="modulepreload" href="js/auth.js" />
  <link rel="modulepreload" href="js/api.js" />
  <link rel="modulepreload" href="js/state.js" />
  <link rel="modulepreload" href="js/ui.js" />
  <link rel="modulepreload" href="js/players.js" />
  <link rel="modulepreload" href="js/model.js" />
  <link rel="modulepreload" href="js/planner.js" />
  <link rel="modulepreload" href="js/scout.js" />
  <link rel="modulepreload" href="js/market.js" />
  <link rel="modulepreload" href="js/status.js" />
  <link rel="modulepreload" href="js/compare.js" />
  <link rel="modulepreload" href="js/fixtures.js" />
  <link rel="modulepreload" href="js/setpieces.js" />
  <link rel="modulepreload" href="js/myteam.js" />
  <link rel="modulepreload" href="js/analyze.js" />
  <link rel="modulepreload" href="js/drawer.js" />
  <link rel="modulepreload" href="js/home.js" />
  <link rel="modulepreload" href="js/lineups.js" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--accent)"/>
          <rect x="4" y="6" width="24" height="20" rx="2" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.6"/>
          <line x1="16" y1="6" x2="16" y2="26" stroke="rgba(255,255,255,0.85)" stroke-width="1.6"/>
          <circle cx="16" cy="16" r="4.2" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.6"/>
        </svg>
        <span class="brand-name">amit<strong>fpl</strong></span>
        <span class="brand-sub">FPL Toolkit</span>
      </div>
      <div class="chips">
        <div class="updated-chip" id="updated-chip" hidden>
          <span id="updated-text"></span>
          <button id="refresh-btn" title="Refresh data now" aria-label="Refresh data">⟳</button>
        </div>
        <button id="auth-btn" class="theme-btn auth-btn" hidden title="Sign in" aria-label="Sign in">👤</button>
        <button id="theme-btn" class="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
        <button id="lang-btn" class="theme-btn lang-btn" title="עברית" aria-label="עברית">עב</button>
        <button id="help-btn" class="theme-btn" title="Help &amp; glossary" aria-label="Help">?</button>
        <div class="deadline-chip" id="deadline-chip" hidden>
          <span class="deadline-label" id="deadline-gw"></span>
          <span class="deadline-time" id="deadline-time"></span>
        </div>
      </div>
    </div>
    <!-- Five everyday tabs stay visible; the deeper research tools live
         under "More" so the first impression isn't a wall of tabs. -->
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="home">Home</button>
      <button class="tab" data-tab="myteam">My Team</button>
      <button class="tab" data-tab="players">Players</button>
      <button class="tab" data-tab="planner">Planner</button>
      <button class="tab" data-tab="fixtures">Fixtures</button>
      <button class="tab tab-more" id="more-btn" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu">More ▾</button>
    </nav>
    <!-- Lives outside .tabs: the tab bar's scroll-edge fade is a CSS mask
         that would erase anything drawn beyond its box. -->
    <div class="more-menu" id="more-menu" hidden>
      <button class="tab" data-tab="scout">Scout</button>
      <button class="tab" data-tab="market">Market</button>
      <button class="tab" data-tab="status">Status</button>
      <button class="tab" data-tab="compare">Compare</button>
      <button class="tab" data-tab="lineups">Lineups</button>
      <button class="tab" data-tab="matches">Matches</button>
      <button class="tab" data-tab="setpieces">Set Pieces</button>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading FPL data…</p>
    </div>
    <div id="error" class="error-box" hidden></div>

    <section id="view-home" class="view" hidden></section>
    <section id="view-players" class="view" hidden></section>
    <section id="view-planner" class="view" hidden></section>
    <section id="view-scout" class="view" hidden></section>
    <section id="view-market" class="view" hidden></section>
    <section id="view-status" class="view" hidden></section>
    <section id="view-compare" class="view" hidden></section>
    <section id="view-fixtures" class="view" hidden></section>
    <section id="view-lineups" class="view" hidden></section>
    <section id="view-matches" class="view" hidden></section>
    <section id="view-setpieces" class="view" hidden></section>
    <section id="view-myteam" class="view" hidden></section>
  </main>

  <div id="help-overlay" class="drawer-overlay" hidden>
    <div class="drawer" role="dialog" aria-label="Help">
      <button class="drawer-close" title="Close">✕</button>
      <div id="help-content"><!-- filled by applyStaticI18n() in the active language --></div>
    </div>
  </div>

  <footer class="footer">
    <span>amitfpl v2 · data: official Fantasy Premier League API + ClubElo · refreshes every 30 min · <a href="https://github.com/StevenGerrardSG8/amitfpl" target="_blank" rel="noopener" style="color:inherit">source</a></span>
  </footer>

  <script>
    // Boot guard: keep the user informed if startup is slow or broken.
    // Runs before the JS modules, so it carries its own tiny EN/HE dict.
    (function () {
      var isFile = location.protocol === 'file:';
      var isLocal = location.hostname === 'localhost' || location.hostname.startsWith('192.168.');
      var he = document.documentElement.dir === 'rtl';
      var T = {
        fileBlocked: he
          ? '<strong>הדף נפתח כקובץ, ולכן הדפדפן חוסם את האפליקציה.</strong><br>סגרו את הלשונית הזו ולחצו לחיצה כפולה על <b>Start amitfpl.command</b> במקום.'
          : '<strong>This page was opened as a file, so the browser blocks the app.</strong><br>Close this tab and double-click <b>Start amitfpl.command</b> instead.',
        slow: he
          ? 'חיבור איטי - עדיין טוען, רגע…'
          : 'Slow connection - still loading, hang tight…',
        broke: he
          ? '<strong>משהו נשבר בהפעלה:</strong><br>'
          : '<strong>Something broke while starting:</strong><br>',
        serverDown: he
          ? 'עדיין כלום? ייתכן שהשרת המקומי כבוי - הפעילו מחדש עם <b>Start amitfpl.command</b>.<br>'
          : 'Still nothing? The local server may be down - relaunch with <b>Start amitfpl.command</b>.<br>',
        stillLoading: he
          ? 'עדיין טוען… החיבור נראה איטי מאוד.<br>'
          : 'Still loading… the connection looks very slow.<br>',
        reload: he ? 'טעינה מחדש' : 'Reload'
      };
      var reloadBtn = '<button onclick="location.reload()" style="margin-top:8px;padding:8px 20px;border-radius:8px;border:none;background:#4f46e5;color:#fff;font-weight:700">' + T.reload + '</button>';
      window.__bootError = null;
      window.addEventListener('error', function (e) {
        if (!window.__bootError && e.message) window.__bootError = e.message;
      });
      function note(html, keepSpinner) {
        var loading = document.getElementById('loading');
        if (!loading || loading.hidden || window.__appStarted) return;
        var box = document.getElementById('boot-note');
        if (!box) {
          box = document.createElement('div');
          box.id = 'boot-note';
          box.style.cssText = 'max-width:640px;margin:14px auto 0;text-align:center;color:#5b6478;font-size:13px';
          loading.appendChild(box);
        }
        if (!keepSpinner) loading.querySelector('.spinner')?.remove();
        box.innerHTML = html;
      }
      if (isFile) {
        setTimeout(function () { note(T.fileBlocked, false); }, 300);
        return;
      }
      setTimeout(function () {
        note(T.slow, true);
      }, 8000);
      setTimeout(function () {
        if (window.__bootError) {
          note(T.broke + '<code>' + String(window.__bootError).slice(0, 200) + '</code><br>' + reloadBtn, false);
        } else {
          note((isLocal ? T.serverDown : T.stillLoading) + reloadBtn, true);
        }
      }, 25000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
