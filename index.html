<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>amitfpl — FPL Toolkit</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      if (localStorage.getItem('amitfpl:theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) { /* private mode */ }
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="modulepreload" href="js/api.js" />
  <link rel="modulepreload" href="js/state.js" />
  <link rel="modulepreload" href="js/ui.js" />
  <link rel="modulepreload" href="js/players.js" />
  <link rel="modulepreload" href="js/model.js" />
  <link rel="modulepreload" href="js/planner.js" />
  <link rel="modulepreload" href="js/scout.js" />
  <link rel="modulepreload" href="js/market.js" />
  <link rel="modulepreload" href="js/status.js" />
  <link rel="modulepreload" href="js/compare.js" />
  <link rel="modulepreload" href="js/fixtures.js" />
  <link rel="modulepreload" href="js/setpieces.js" />
  <link rel="modulepreload" href="js/myteam.js" />
  <link rel="modulepreload" href="js/drawer.js" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">⚽</span>
        <span class="brand-name">amit<strong>fpl</strong></span>
        <span class="brand-sub">FPL Toolkit</span>
      </div>
      <div class="chips">
        <div class="updated-chip" id="updated-chip" hidden>
          <span id="updated-text"></span>
          <button id="refresh-btn" title="Refresh data now" aria-label="Refresh data">⟳</button>
        </div>
        <button id="theme-btn" class="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
        <div class="deadline-chip" id="deadline-chip" hidden>
          <span class="deadline-label" id="deadline-gw"></span>
          <span class="deadline-time" id="deadline-time"></span>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="players">Players</button>
      <button class="tab" data-tab="planner">Planner</button>
      <button class="tab" data-tab="scout">Scout</button>
      <button class="tab" data-tab="market">Market</button>
      <button class="tab" data-tab="status">Status</button>
      <button class="tab" data-tab="compare">Compare</button>
      <button class="tab" data-tab="fixtures">Fixtures</button>
      <button class="tab" data-tab="setpieces">Set Pieces</button>
      <button class="tab" data-tab="myteam">My Team</button>
    </nav>
  </header>

  <main class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading FPL data…</p>
    </div>
    <div id="error" class="error-box" hidden></div>

    <section id="view-players" class="view" hidden></section>
    <section id="view-planner" class="view" hidden></section>
    <section id="view-scout" class="view" hidden></section>
    <section id="view-market" class="view" hidden></section>
    <section id="view-status" class="view" hidden></section>
    <section id="view-compare" class="view" hidden></section>
    <section id="view-fixtures" class="view" hidden></section>
    <section id="view-setpieces" class="view" hidden></section>
    <section id="view-myteam" class="view" hidden></section>
  </main>

  <footer class="footer">
    <span>Data: official Fantasy Premier League API · auto-refreshes in the background · personal tool</span>
  </footer>

  <script>
    // Stuck-spinner guard: if the app hasn't booted (file:// open, dead
    // server, blocked modules), replace the spinner with instructions.
    (function () {
      var isFile = location.protocol === 'file:';
      setTimeout(function () {
        if (window.__appStarted) return;
        var loading = document.getElementById('loading');
        if (!loading || loading.hidden) return;
        loading.innerHTML =
          '<div class="error-box" style="max-width:640px;margin:0 auto;text-align:left">' +
          (isFile
            ? '<strong>This page was opened as a file, so the browser blocks the app.</strong><br>' +
              'Close this tab and double-click <b>Start amitfpl.command</b> (in the amitfpl folder or on the Desktop) — it opens the app properly.'
            : '<strong>The app is taking too long to start.</strong><br>' +
              'The local server may be down. Close this tab and double-click <b>Start amitfpl.command</b> to relaunch.') +
          '</div>';
      }, isFile ? 300 : 8000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
